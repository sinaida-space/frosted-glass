<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <title>Frosted Glass</title>
    <meta name="description" content="A browser instrument that turns a webcam into a pane of fogged glass: a shape behind fog, built for stage backdrops and for footage you keep. Runs entirely on your device." />
    <link rel="canonical" href="https://sinaida-space.github.io/frosted-glass/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Frosted Glass" />
    <meta property="og:description" content="A browser instrument that turns a webcam into a pane of fogged glass: a shape behind fog, built for stage backdrops and for footage you keep. Runs entirely on your device." />
    <meta property="og:url" content="https://sinaida-space.github.io/frosted-glass/" />
    <meta property="og:image" content="https://sinaida-space.github.io/frosted-glass/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frosted Glass" />
    <meta name="twitter:description" content="A browser instrument that turns a webcam into a pane of fogged glass: a shape behind fog, built for stage backdrops and for footage you keep." />
    <meta name="twitter:image" content="https://sinaida-space.github.io/frosted-glass/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted display and body faces — preloaded so the terminal chrome and
         welcome prose don't flash a fallback face on first paint. -->
    <link rel="preload" href="/fonts/GeistPixel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/LibreFranklin-Light.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      script-src has to name cdn.jsdelivr.net and allow wasm compilation. MediaPipe's
      FilesetResolver appends a <script> tag pointing at vision_wasm_*_internal.js on the
      CDN, so `script-src 'self'` blocked the tasks-vision runtime outright and the camera
      could never start; connect-src alone is not enough because the glue is loaded as a
      script element, not fetched. 'wasm-unsafe-eval' is the narrow grant that lets the
      .wasm compile without opening up eval().
      font-src 'self' is required for the self-hosted Geist Pixel / Libre Franklin woff2s;
      without it, @font-face requests are blocked and both faces fall back to system fonts.
      frame-ancestors is ignored in a meta tag and is set as a real header at the edge.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://static.cloudflareinsights.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #050505;
      }
      /* Fixed rather than a percentage height: `height: 100%` on a canvas whose parent
         has auto height resolves to the 150px intrinsic default, which is what the
         drawing buffer would then have been sized against. */
      #stage {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <div id="site"></div>
    <noscript>
      Frosted Glass needs JavaScript and a camera to run. Enable JavaScript and reload this page.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
